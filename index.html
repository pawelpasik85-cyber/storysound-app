<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StorySound">
<meta name="description" content="Czytasz bajkę na głos, a aplikacja dodaje dźwięki i efekty.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>StorySound AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root {
  --bg: #0a0e2c;
  --bg2: #070a22;
  --panel: rgba(18, 24, 66, 0.86);
  --panel2: rgba(28, 34, 90, 0.7);
  --line: rgba(120, 140, 255, 0.22);
  --glow-o: rgba(255, 164, 72, 0.75);
  --glow-b: rgba(86, 140, 255, 0.7);
  --text: #f5f3ff;
  --dim: #b4b8e6;
  --faint: #7f86bd;
  --gold: #ffc857;
  --orange: #ffa23a;
  --pink: #ff4fb8;
  --violet: #8b5cff;
  --blue: #3b8cff;
  --green: #2ee6a0;
  --red: #ff4d6d;
  --paper: #f7ecd4;
  --ink: #2a2140;
  --display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --grad: linear-gradient(90deg, #ff4fd8 0%, #9b5cff 45%, #3bb3ff 100%);
  --grad-warm: linear-gradient(90deg, #ff4fb8 0%, #8b5cff 40%, #3b8cff 75%, #ffd34f 100%);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: #05071a;
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  overflow: hidden;
}
body::before {
  content: ''; position: fixed; inset: -40px;
  background: var(--bg-img) center / cover no-repeat, radial-gradient(120% 90% at 50% 0%, #2a1f6b, #070b24);
  opacity: .75;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { opacity: .35; cursor: default; }
img { display: block; max-width: 100%; }
input, select, textarea { font: inherit; color: inherit; }
svg { flex: none; }

#app {
  position: relative; margin: 0 auto; height: 100%; max-width: 480px; overflow: hidden;
  background:
    radial-gradient(90% 40% at 50% 0%, rgba(80, 60, 200, .35), transparent 70%),
    radial-gradient(80% 50% at 50% 100%, rgba(40, 80, 200, .25), transparent 70%),
    linear-gradient(180deg, var(--bg), var(--bg2));
}
@media (min-width: 560px) {
  #app { height: calc(100% - 32px); margin-top: 16px; border-radius: 30px;
    box-shadow: 0 0 0 1.5px var(--glow-o), 0 0 36px rgba(255, 140, 60, .35), 0 30px 80px rgba(0, 0, 0, .6); }
}
#screen { position: absolute; inset: 0 0 calc(74px + env(safe-area-inset-bottom)) 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
#screen::-webkit-scrollbar { display: none; }

/* ---------- bottom navigation */
#nav {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
  height: calc(74px + env(safe-area-inset-bottom)); padding: 0 8px env(safe-area-inset-bottom);
  display: grid; grid-template-columns: 1fr 1fr 84px 1fr 1fr; align-items: center;
  background: linear-gradient(180deg, rgba(14, 18, 52, .92), rgba(8, 10, 34, .98));
  border-top: 1px solid var(--line);
}
.nav-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 700; color: var(--dim); padding: 8px 0; }
.nav-btn svg { width: 24px; height: 24px; }
.nav-btn.on { color: var(--orange); }
.nav-btn.on svg { filter: drop-shadow(0 0 8px rgba(255, 162, 58, .7)); }
.nav-mic {
  justify-self: center; margin-top: -30px; width: 70px; height: 70px; border-radius: 50%;
  display: grid; place-items: center; color: #fff;
  background: radial-gradient(circle at 35% 30%, #c79bff, #8b5cff 45%, #4b2bd6);
  box-shadow: 0 0 0 4px rgba(10, 14, 44, 1), 0 0 26px rgba(139, 92, 255, .9), inset 0 -4px 12px rgba(0, 0, 0, .25);
  position: relative;
}
.nav-mic::after { will-change: opacity; content: ''; position: absolute; inset: -6px; border-radius: 50%; box-shadow: 0 0 34px 6px rgba(160, 110, 255, .9); opacity: 0; animation: glowpulse 3s ease-in-out infinite; pointer-events: none; }
@keyframes glowpulse { 50% { opacity: 1; } }
.nav-mic svg { width: 30px; height: 30px; }

/* ---------- common */
.page { padding: calc(14px + env(safe-area-inset-top)) 16px 24px; }
.page-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; min-height: 44px; }
.h1 { font-family: var(--display); font-weight: 700; font-size: 24px; margin: 0; flex: 1; }
.page-h .h1:first-child { text-align: left; }
.add .page-h .h1 { text-align: center; }
.mini-brand img { height: 42px; width: auto; -webkit-mask-image: radial-gradient(75% 70% at 50% 50%, #000 60%, transparent 100%); mask-image: radial-gradient(75% 70% at 50% 50%, #000 60%, transparent 100%); }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: var(--text); flex: none; }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.glass { background: rgba(10, 14, 40, .62); border: 1px solid rgba(255, 255, 255, .16); }
.icon-btn.round { border: 1.5px solid rgba(120, 160, 255, .5); background: rgba(40, 60, 150, .3); width: 52px; height: 52px; }
.icon-btn.fav { color: #ff6b9a; }
.dim { color: var(--dim); }
.small { font-size: 12.5px; }
.link { color: #7fb1ff; font-weight: 700; font-size: 13px; }
.link.danger { color: #ff8aa0; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 2px 10px; gap: 8px; }
.sec-h h2 { font-family: var(--display); font-weight: 600; font-size: 19px; margin: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 16px; margin: 14px 0; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); }
.card h3 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 0 0 8px; }
.card p { margin: 6px 0; line-height: 1.45; }
.search { display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 46px; border-radius: 16px; background: rgba(255, 255, 255, .07); border: 1px solid var(--line); color: var(--dim); margin-bottom: 12px; }
.search input { flex: 1; border: 0; background: none; outline: none; font-size: 15px; min-width: 0; }
.search svg { width: 20px; height: 20px; }
.empty { color: var(--dim); text-align: center; grid-column: 1 / -1; padding: 30px 10px; }

.btn-grad { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 52px; padding: 0 22px; border-radius: 999px; color: #fff; font-weight: 800; font-size: 16.5px;
  background: var(--grad-warm); box-shadow: 0 8px 26px rgba(139, 92, 255, .45), inset 0 1px 0 rgba(255, 255, 255, .35); }
.btn-grad svg { width: 22px; height: 22px; }
.btn-grad.wide { width: 100%; margin: 16px 0 6px; }
.btn-grad.big { width: 100%; height: auto; padding: 14px 20px; border-radius: 22px; justify-content: flex-start; text-align: left; background: var(--grad); }
.btn-grad.big svg { width: 34px; height: 34px; padding: 6px; border-radius: 50%; background: rgba(255, 255, 255, .2); }
.btn-grad.big span { display: flex; flex-direction: column; font-family: var(--display); font-weight: 600; font-size: 18px; }
.btn-grad.big small { font-family: var(--body); font-weight: 600; font-size: 13px; opacity: .9; }
.btn-red { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 54px; padding: 0 26px; border-radius: 999px; color: #fff; font-weight: 800; font-size: 17px; flex: 1;
  background: linear-gradient(90deg, #ff3d6e, #ff6a3d); box-shadow: 0 8px 24px rgba(255, 77, 109, .45); }
.btn-red svg { width: 20px; height: 20px; background: #fff; color: #ff3d6e; border-radius: 50%; padding: 4px; width: 28px; height: 28px; }
.btn-soft { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 14px; background: rgba(255, 255, 255, .08); border: 1px solid var(--line); font-weight: 700; font-size: 14px; }
.btn-soft svg { width: 18px; height: 18px; }
.btn-soft.wide { width: 100%; margin-top: 14px; }

.seg { display: flex; padding: 4px; border-radius: 16px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); gap: 4px; margin: 4px 0 14px; }
.seg button { flex: 1; height: 38px; border-radius: 12px; font-weight: 700; font-size: 13.5px; color: var(--dim); display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button svg { width: 16px; height: 16px; }
.seg button.on { color: #fff; background: linear-gradient(180deg, rgba(90, 120, 255, .55), rgba(60, 80, 220, .45)); box-shadow: 0 0 0 1px rgba(120, 160, 255, .6), 0 0 14px rgba(80, 130, 255, .45); }
.seg.small { margin: 8px 0 0; }
.seg.small button { height: 34px; font-size: 13px; }
.chips, .catgrid { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 14px; }
.chip { height: 34px; padding: 0 14px; border-radius: 12px; font-weight: 700; font-size: 13px; background: rgba(255, 255, 255, .07); border: 1px solid var(--line); color: var(--dim); }
.chip.on { color: #fff; background: linear-gradient(180deg, #9b6bff, #6a3df0); border-color: transparent; box-shadow: 0 0 14px rgba(139, 92, 255, .5); }

/* ---------- home */
.home { padding-bottom: 20px; }
.brand { padding: calc(8px + env(safe-area-inset-top)) 12px 0; position: relative; z-index: 2; margin-bottom: 0; }
.brand img { width: 88%; margin: 0 auto; -webkit-mask-image: radial-gradient(70% 72% at 50% 48%, #000 62%, transparent 100%); mask-image: radial-gradient(70% 72% at 50% 48%, #000 62%, transparent 100%); }
.hero { position: relative; aspect-ratio: 1776 / 896; max-height: 300px; width: 100%; overflow: hidden; }
.hero > img { width: 100%; height: 100%; object-fit: cover; object-position: 30% 25%; }
.hero-fade { position: absolute; inset: 0; background: linear-gradient(180deg, var(--bg) 0%, transparent 10%, transparent 70%, var(--bg) 100%); pointer-events: none; }
.features { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 4px 10px 0; margin-top: -26px; position: relative; z-index: 3; }
.feat { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; line-height: 1.15; text-align: center; font-weight: 700; }
.fc { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; color: #fff; border: 2px solid rgba(255, 255, 255, .35); box-shadow: 0 6px 18px rgba(0, 0, 0, .35), inset 0 2px 6px rgba(255, 255, 255, .35); }
.fc svg { width: 26px; height: 26px; }
.f1 { background: radial-gradient(circle at 35% 30%, #ff9ad8, #e0319b 60%, #a0126e); box-shadow: 0 0 18px rgba(255, 79, 184, .6); }
.f2 { background: radial-gradient(circle at 35% 30%, #ffd08a, #ff8a1e 60%, #c85a00); box-shadow: 0 0 18px rgba(255, 150, 40, .6); }
.f3 { background: radial-gradient(circle at 35% 30%, #8ff5c0, #19c47a 60%, #0a7c4a); box-shadow: 0 0 18px rgba(46, 230, 160, .55); }
.f4 { background: radial-gradient(circle at 35% 30%, #9fcaff, #3b82f6 60%, #1d4ed8); box-shadow: 0 0 18px rgba(59, 130, 246, .6); }
.f5 { background: radial-gradient(circle at 35% 30%, #d8b4ff, #9b5cff 60%, #6427d9); box-shadow: 0 0 18px rgba(155, 92, 255, .6); }
.cta-row { padding: 18px 16px 0; }
.home .cats, .home .create-banner, .home .foot { margin-left: 16px; margin-right: 16px; }
.hscroll { display: flex; gap: 12px; overflow-x: auto; padding: 2px 16px 6px; margin: 0 -16px; scroll-snap-type: x mandatory; scroll-padding: 0 16px; scrollbar-width: none; }
.home .hscroll { margin: 0; padding: 2px 16px 6px; }
.home .sec-h { margin-left: 16px; margin-right: 16px; }
.hscroll::-webkit-scrollbar { display: none; }
.scard { flex: none; width: 138px; text-align: left; scroll-snap-align: start; display: flex; flex-direction: column; gap: 2px; }
.scard-img { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 4 / 3; margin-bottom: 6px; border: 1px solid rgba(255, 255, 255, .14); box-shadow: 0 8px 20px rgba(0, 0, 0, .35); }
.scard-img img { width: 100%; height: 100%; object-fit: cover; }
.scard b { font-size: 14px; font-weight: 800; line-height: 1.2; }
.scard small { font-size: 12px; color: var(--dim); }
.scard small.dim { color: var(--faint); }
.scard.wide { width: auto; }
.badge { position: absolute; left: 7px; top: 7px; font-size: 10.5px; font-weight: 800; text-transform: uppercase; padding: 3px 8px; border-radius: 8px; background: linear-gradient(90deg, #ff5a7a, #ff3db8); box-shadow: 0 2px 8px rgba(0, 0, 0, .3); }
.badge.own { background: linear-gradient(90deg, #2ec7ff, #7b5cff); }
.rcard { flex: none; width: 150px; text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; scroll-snap-align: start; }
.rcard img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
.rcard b { display: block; padding: 8px 10px 0; font-size: 13.5px; }
.rcard small { display: block; padding: 2px 10px 10px; font-size: 12px; color: var(--dim); }
.cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.cat-tile { border-radius: 16px; overflow: hidden; aspect-ratio: 82 / 86; box-shadow: 0 6px 16px rgba(0, 0, 0, .35); transition: transform .15s; }
.cat-tile img { width: 100%; height: 100%; object-fit: cover; }
.cat-tile:active { transform: scale(.96); }
.cats-lib { display: flex; overflow-x: auto; gap: 10px; margin: 0 -16px 12px; padding: 4px 16px; scrollbar-width: none; }
.cats-lib .cat-tile { flex: none; width: 82px; }
.cat-tile.on { box-shadow: 0 0 0 2.5px var(--orange), 0 0 16px rgba(255, 162, 58, .7); }
.create-banner { position: relative; display: block; margin-top: 22px; border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 1.5px rgba(160, 120, 255, .6), 0 0 26px rgba(139, 92, 255, .45); width: calc(100% - 32px); }
.create-banner img { width: 100%; aspect-ratio: 318 / 167; object-fit: cover; }
.cb-plus { position: absolute; left: 12px; bottom: 12px; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: rgba(10, 12, 40, .78); font-weight: 800; font-size: 14px; }
.cb-plus svg { width: 18px; height: 18px; }
.foot { color: var(--faint); font-size: 12px; text-align: center; margin-top: 18px; line-height: 1.4; }

/* ---------- library */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 12px; }
.add-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; border-radius: 18px; background: rgba(139, 92, 255, .14); border: 1.5px dashed rgba(170, 140, 255, .55); margin-bottom: 14px; text-align: left; }
.add-row svg { width: 34px; height: 34px; padding: 6px; border-radius: 50%; background: var(--violet); }
.add-row b { display: block; }
.add-row small { color: var(--dim); }

/* ---------- overlays + sheets */
#overlays { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
.overlay { position: absolute; inset: 0; z-index: 1; isolation: isolate; overflow-y: auto; overflow-x: hidden; pointer-events: auto; transform: translateX(30px); opacity: 0; transition: transform .28s ease, opacity .28s ease;
  background: radial-gradient(90% 40% at 50% 0%, rgba(80, 60, 200, .3), transparent 70%), linear-gradient(180deg, var(--bg), var(--bg2)); scrollbar-width: none; }
.overlay::-webkit-scrollbar { display: none; }
.overlay.in { transform: none; opacity: 1; }
.sheet-wrap { position: absolute; inset: 0; z-index: 60; }
.sheet-bg { position: absolute; inset: 0; background: rgba(2, 3, 16, .55); opacity: 0; transition: opacity .25s; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 82%; overflow-y: auto; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); border-radius: 26px 26px 0 0;
  background: linear-gradient(180deg, #161c52, #0b0f30); border-top: 1px solid rgba(120, 150, 255, .4); box-shadow: 0 -10px 40px rgba(0, 0, 0, .5); transform: translateY(100%); transition: transform .3s ease; }
.sheet-wrap.in .sheet { transform: none; }
.sheet-wrap.in .sheet-bg { opacity: 1; }
.sheet-grip { width: 44px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .25); margin: 4px auto 10px; }
.sheet-h { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 10px 0 10px; }
#toast { position: absolute; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); z-index: 90; width: max-content; max-width: calc(100% - 32px);
  padding: 12px 18px; border-radius: 16px; background: rgba(20, 24, 70, .96); border: 1px solid rgba(140, 160, 255, .45); font-weight: 700; font-size: 14px; text-align: center;
  opacity: 0; pointer-events: none; transition: all .25s; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- story detail */
.d-hero { position: relative; height: 290px; overflow: hidden; }
.d-hero > img { width: 100%; height: 100%; object-fit: cover; }
.d-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5, 8, 30, .45) 0%, transparent 25%, transparent 55%, var(--bg) 100%); pointer-events: none; }
.d-top { position: absolute; z-index: 3; left: 0; right: 0; top: 0; display: flex; gap: 8px; padding: calc(12px + env(safe-area-inset-top)) 14px 0; }
.d-top span { flex: 1; }
.d-play { position: absolute; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(10, 16, 50, .55); border: 2px solid rgba(255, 255, 255, .7); box-shadow: 0 0 30px rgba(120, 180, 255, .5); }
.d-play svg { width: 30px; height: 30px; margin-left: 4px; }
.d-body { padding: 0 18px 30px; margin-top: -40px; position: relative; z-index: 2; }
.d-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.d-title h1 { font-family: var(--display); font-weight: 700; font-size: 28px; margin: 0; text-shadow: 0 2px 12px rgba(0, 0, 0, .6); }
.pill-new { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 9px; background: linear-gradient(90deg, #ff4fb8, #9b5cff); }
.d-sub { color: var(--dim); font-weight: 700; margin-top: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 14px 0 4px; color: var(--dim); font-size: 13.5px; font-weight: 700; align-items: center; }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.meta svg { width: 18px; height: 18px; }
.fav-link { display: inline-flex; align-items: center; gap: 6px; color: #ff7aa2; font-weight: 800; font-size: 13.5px; }
.fav-link svg { width: 18px; height: 18px; }
.d-desc { color: #d9dbf7; line-height: 1.55; font-size: 15px; }
.rmode { margin-top: 10px; }
.rmode-l { font-weight: 800; font-size: 13px; color: var(--dim); }
.rmode-h { display: block; color: var(--faint); font-size: 12.5px; margin-top: 6px; min-height: 17px; }
.h3 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 18px 0 10px; }
.chapters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.ch { text-align: left; font-size: 12px; }
.ch img { width: 100%; aspect-ratio: 13 / 10; object-fit: cover; border-radius: 12px; border: 1.5px solid rgba(255, 200, 120, .45); margin-bottom: 6px; }
.ch b { display: block; font-size: 12.5px; line-height: 1.2; }
.ch small { display: inline-flex; align-items: center; gap: 3px; color: var(--faint); font-size: 11px; margin-top: 2px; }
.ch small svg { width: 12px; height: 12px; }
.fx-box { margin-top: 18px; padding: 12px; border-radius: 18px; border: 1px solid rgba(120, 150, 255, .35); background: rgba(20, 28, 80, .5); }
.fx-box h4 { margin: 0 0 10px; font-size: 13.5px; }
.fx-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.fx-tile { flex: none; width: 64px; text-align: center; font-size: 11px; font-weight: 700; color: var(--dim); }
.fx-tile img, .fx-tile .fx-emoji { width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 5px; object-fit: cover; }
.fx-tile b { display: block; font-weight: 700; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fx-tile small { display: block; color: var(--green); font-size: 10.5px; font-weight: 800; }
.fx-tile.active img, .fx-tile.active .fx-emoji { box-shadow: 0 0 0 2px var(--green), 0 0 14px rgba(46, 230, 160, .6); }
.fx-emoji { display: grid; place-items: center; font-size: 28px; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 70%, white), var(--c) 55%, color-mix(in srgb, var(--c) 55%, black)); }

/* ---------- reader */
.reader { display: flex; flex-direction: column; height: 100%; }
.r-top { position: absolute; z-index: 5; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 12px 0; }

.r-scene > img { width: 100%; height: 100%; object-fit: cover; transition: opacity .35s, filter .8s; }

.r-scene::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5, 8, 30, .55) 0%, transparent 28%, transparent 70%, rgba(7, 10, 34, .9) 100%); pointer-events: none; }
.r-tint { position: absolute; inset: 0; transition: background 1.2s; pointer-events: none; z-index: 1; }

.r-tint.rainy { background: rgba(40, 60, 120, .25); }

.fx-wrap { position: relative; }
.fx-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.fx-flash { position: absolute; inset: 0; background: #dbe6ff; opacity: 0; pointer-events: none; z-index: 3; }
.fx-flash.go { animation: flash 1.1s ease-out; }
@keyframes flash { 0% { opacity: 0 } 8% { opacity: var(--fl) } 22% { opacity: calc(var(--fl) * .15) } 30% { opacity: calc(var(--fl) * .45) } 100% { opacity: 0 } }
.pop-icon { position: absolute; bottom: 24%; z-index: 4; font-size: 46px; transform: translateX(-50%); animation: popup 2.2s ease-out forwards; pointer-events: none; filter: drop-shadow(0 4px 12px rgba(0, 0, 0, .5)); }
@keyframes popup { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.5) } 18% { opacity: 1; transform: translate(-50%, 0) scale(1.1) } 70% { opacity: 1 } 100% { opacity: 0; transform: translate(-50%, -60px) scale(.9) } }
.sounds-fx { position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: .55; }
.sounds-fx ~ * { position: relative; z-index: 2; }

.pal { will-change: transform; position: absolute; z-index: 4; left: 12px; bottom: 12px; width: 84px; height: 84px; cursor: pointer; }
.pal-img { border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 2px rgba(255, 255, 255, .6), 0 8px 22px rgba(0, 0, 0, .5); }
.pal-img img { width: 100%; height: 100%; object-fit: cover; }
.pal-svg { width: 104px; height: 104px; left: 6px; bottom: 2px; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .55)); }
.pal-svg .dragon, .pal-svg svg { width: 100%; height: 100%; }
.pal { animation: bob 3.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.pal.mood-listen { animation: bob 1.6s ease-in-out infinite; }
.pal.mood-scared { animation: shiver .09s linear infinite; }
@keyframes shiver { 0% { transform: translate(-1.5px, 0) } 50% { transform: translate(1.5px, 1px) } 100% { transform: translate(-1px, -1px) } }
.pal.mood-laugh { animation: hop .45s ease-in-out infinite; }
@keyframes hop { 50% { transform: translateY(-10px) rotate(-4deg); } }
.pal.mood-surprised { animation: jump .6s ease-out 2; }
@keyframes jump { 30% { transform: translateY(-18px) scale(1.08); } }
.pal.mood-magic.pal-img { box-shadow: 0 0 0 2px #ffe08a, 0 0 26px rgba(255, 210, 90, .9); animation: bob 1.2s ease-in-out infinite; }
.pal.mood-sleepy { animation: sway 4s ease-in-out infinite; filter: saturate(.8) brightness(.85); }
@keyframes sway { 50% { transform: rotate(-6deg) translateY(3px); } }
.pal.mood-sleepy::after { content: 'z z'; position: absolute; right: -16px; top: -10px; font-family: var(--display); font-weight: 700; color: #cfd6ff; animation: zz 2.4s ease-in-out infinite; }
@keyframes zz { 0% { opacity: 0; transform: translateY(6px) } 50% { opacity: 1 } 100% { opacity: 0; transform: translateY(-12px) } }
.bubble { position: absolute; z-index: 5; left: 96px; bottom: 70px; max-width: 58%; padding: 8px 12px; border-radius: 16px 16px 16px 4px; background: #fff; color: #2a2140; font-weight: 800; font-size: 14px; box-shadow: 0 6px 18px rgba(0, 0, 0, .35); }
.bubble.pop { animation: bpop .3s ease-out; }
@keyframes bpop { 0% { transform: scale(.6); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }

.r-paper { flex: 1; min-height: 120px; overflow-y: auto; margin: -22px 12px 0; position: relative; z-index: 3; border-radius: 18px; padding: 16px 18px 20px;
  background: linear-gradient(180deg, #fbf3df, #f1e2c2); color: var(--ink); box-shadow: 0 10px 30px rgba(0, 0, 0, .45), inset 0 0 40px rgba(170, 120, 60, .18); scrollbar-width: thin; }
.reader.free .r-paper { background: rgba(18, 24, 66, .92); color: var(--text); box-shadow: 0 10px 30px rgba(0, 0, 0, .45); border: 1px solid var(--line); }
.r-text { font-family: Georgia, 'Times New Roman', serif; line-height: 1.6; }
.r-text .w { transition: color .3s, background .3s; border-radius: 6px; }
.mode-tts .r-text .w, .mode-demo .r-text .w { color: rgba(42, 33, 64, .55); }
.mode-tts .r-text .w.read, .mode-demo .r-text .w.read, .mode-mic .r-text .w.read { color: var(--ink); }
.r-text .w.now { background: rgba(139, 92, 255, .18); }
.r-text .cue, .free-live .cue { color: #fff !important; background: var(--c); padding: 0 5px; box-shadow: 0 0 10px color-mix(in srgb, var(--c) 70%, transparent); }
.free-hint { font-family: var(--body); color: var(--dim); font-size: 15px; line-height: 1.5; margin: 0 0 10px; }
.r-paper.photo .free-hint { color: #5b4b6b; }
.free-live { font-family: var(--body); font-size: 18px; line-height: 1.6; min-height: 60px; margin: 0; }
.free-live span { border-radius: 6px; }
.r-strip { flex: none; display: flex; gap: 8px; overflow-x: auto; padding: 12px 12px 4px; scrollbar-width: none; min-height: 92px; }
.r-strip::-webkit-scrollbar { display: none; }
.r-strip .fx-tile { width: 60px; }
.r-strip .fx-tile img, .r-strip .fx-tile .fx-emoji { width: 52px; height: 52px; }
.strip-empty { margin: auto; color: var(--faint); font-size: 12.5px; }
.r-controls { flex: none; padding: 0 14px calc(14px + env(safe-area-inset-bottom)); }
.player .prog { padding: 6px 2px 4px; }
.prog-bar { position: relative; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .15); --p: 0; }
.prog-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--p) * 100%); border-radius: 3px; background: var(--grad); transition: width .3s; }
.prog-bar b { position: absolute; top: 50%; left: calc(var(--p) * 100%); width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px rgba(120, 160, 255, .9); transition: left .3s; }
.player-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 6px; }
.time { font-size: 12.5px; color: var(--dim); font-weight: 700; min-width: 86px; }
.play-btn { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #2b3a8f, #121848); border: 2px solid rgba(140, 170, 255, .6); box-shadow: 0 0 20px rgba(80, 130, 255, .5); }
.play-btn svg { width: 26px; height: 26px; }
.listen { text-align: center; }
.wave { display: flex; align-items: center; justify-content: center; gap: 4px; height: 84px; }
.wave i { width: 3px; height: 34px; border-radius: 2px; background: #5aa8ff; opacity: .5; transform: scaleY(.24); }
.wave.on i { animation: wv 1s ease-in-out infinite; opacity: 1; box-shadow: 0 0 8px #3b8cff; }
.wave i:nth-child(3n) { animation-delay: -.3s; } .wave i:nth-child(3n+1) { animation-delay: -.6s; } .wave i:nth-child(4n) { animation-duration: .8s; } .wave i:nth-child(5n) { animation-duration: 1.3s; }
@keyframes wv { 50% { transform: scaleY(1); } }
.mic-orb { width: 76px; height: 76px; border-radius: 50%; margin: 0 10px; display: grid; place-items: center; color: #fff; flex: none;
  background: radial-gradient(circle at 35% 30%, #3a6bff, #1b2a8c 70%); box-shadow: 0 0 0 3px rgba(90, 160, 255, .8), 0 0 30px rgba(60, 130, 255, .8); }
.mic-orb svg { width: 32px; height: 32px; }
.mic-orb { position: relative; }
.mic-orb.on::after { will-change: opacity; content: ''; position: absolute; inset: -8px; border-radius: 50%; box-shadow: 0 0 0 4px rgba(90, 160, 255, .5), 0 0 40px 8px rgba(60, 130, 255, .9); opacity: 0; animation: glowpulse 1.4s ease-in-out infinite; }
.listen-t { color: var(--dim); font-size: 13.5px; line-height: 1.4; margin: 4px 0 12px; }
.listen-t .warn { color: #ffb0bf; }
.listen-btns { display: flex; gap: 10px; align-items: center; }
.listen-btns .btn-grad { flex: 1; }
.ch-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; color: var(--dim); }
.ch-list { display: flex; flex-direction: column; gap: 8px; }
.ch-li { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 14px; background: rgba(255, 255, 255, .05); text-align: left; }
.ch-li img { width: 64px; height: 48px; object-fit: cover; border-radius: 10px; }
.ch-li.on { box-shadow: 0 0 0 1.5px var(--orange); }

/* ---------- sounds */
.tabs3 button { font-size: 13px; }
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.btile { position: relative; border-radius: 18px; overflow: hidden; background: #111847; border: 1.5px solid rgba(120, 150, 255, .35); padding-bottom: 8px; transition: transform .12s; }
.btile img { width: 100%; aspect-ratio: 72 / 54; object-fit: cover; }
.btile b { display: block; font-weight: 800; font-size: 14px; margin-top: 6px; }
.btile small { position: absolute; top: 6px; right: 6px; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 7px; background: rgba(10, 14, 40, .7); color: var(--dim); }
.btile.on { border-color: var(--green); box-shadow: 0 0 16px rgba(46, 230, 160, .5); }
.btile.on small { background: var(--green); color: #05301f; }
.btile:active { transform: scale(.95); }
.snd-list { display: flex; flex-direction: column; gap: 8px; }
.snd-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px; border-radius: 16px; background: rgba(255, 255, 255, .045); border: 1px solid rgba(120, 140, 255, .14); }
.snd-e { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex: none; background: color-mix(in srgb, var(--c) 30%, transparent); border: 1px solid color-mix(in srgb, var(--c) 60%, transparent); }
.snd-main { flex: 1; min-width: 0; }
.snd-main b { font-size: 14.5px; }
.vars { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.var { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 10px; background: rgba(120, 150, 255, .14); color: #cdd6ff; }
.var:active { background: rgba(120, 150, 255, .4); }
.tog-amb { flex: none; align-self: center; font-size: 12.5px; font-weight: 800; padding: 7px 12px; border-radius: 10px; border: 1px solid rgba(46, 230, 160, .5); color: var(--green); }
.tog-amb.on { background: var(--green); color: #06301f; }
.own-snd .own-row { display: flex; gap: 8px; margin-top: 10px; }
.own-snd select { flex: 1; min-width: 0; height: 44px; border-radius: 12px; background: rgba(255, 255, 255, .08); border: 1px solid var(--line); padding: 0 10px; }
.own-snd select option { background: #141a4d; }
.own-items { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.own-item { display: flex; gap: 10px; align-items: center; font-size: 13px; }
.own-item span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mix-master { padding: 10px 14px; }
.srow { display: flex; align-items: center; gap: 10px; padding: 9px 0; }
.srow > svg { width: 20px; height: 20px; color: var(--dim); }
.srow-n { flex: 1.2; font-weight: 700; font-size: 13.5px; }
.srow input { flex: 1; }
.srow-v { width: 58px; text-align: right; font-size: 13px; font-weight: 700; color: var(--dim); }
input[type=range] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #3b8cff, #6aa6ff); outline: none; min-width: 60px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 4px solid #3b8cff; box-shadow: 0 0 10px rgba(59, 140, 255, .9); }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 4px solid #3b8cff; box-shadow: 0 0 10px rgba(59, 140, 255, .9); }
.mix-list { display: flex; flex-direction: column; gap: 8px; }
.mix-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: rgba(20, 28, 80, .55); border: 1px solid rgba(120, 150, 255, .2); }
.mix-row.live { border-color: rgba(46, 230, 160, .5); }
.mix-row.off { opacity: .5; }
.mix-ico img, .mix-ico .fx-emoji { width: 46px; height: 46px; border-radius: 12px; object-fit: cover; font-size: 22px; }
.mix-main { flex: 1; min-width: 0; }
.mix-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.mix-top b { font-size: 14.5px; }
.mix-top em { font-style: normal; font-size: 11px; color: var(--green); font-weight: 800; }
.mix-top .pct { margin-left: auto; font-size: 12.5px; color: var(--dim); font-weight: 700; }
.mix-main input { width: 100%; }
.pw { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid rgba(255, 255, 255, .25); color: var(--faint); flex: none; }
.pw svg { width: 18px; height: 18px; }
.pw.on { color: #7fb1ff; border-color: #3b8cff; box-shadow: 0 0 12px rgba(59, 140, 255, .6); }
.scenes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.scenes.mini { grid-template-columns: repeat(4, 1fr); }
.scene { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 1; border: 1.5px solid rgba(120, 150, 255, .3); }
.scene img { width: 100%; height: 100%; object-fit: cover; }
.scene b { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 4px 6px; font-size: 12.5px; font-weight: 800; background: linear-gradient(180deg, transparent, rgba(0, 0, 0, .75)); }
.scene small { position: absolute; top: 5px; right: 5px; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 7px; background: var(--green); color: #06301f; }
.scene.on { border-color: var(--green); box-shadow: 0 0 16px rgba(46, 230, 160, .55); }

/* ---------- settings */
.trow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid rgba(255, 255, 255, .06); }
.trow:first-of-type { border-top: 0; }
.trow.col { flex-direction: column; align-items: stretch; }
.trow b { display: inline-flex; align-items: center; gap: 6px; font-size: 14.5px; }
.trow b svg { width: 18px; height: 18px; }
.trow small { display: block; color: var(--faint); font-size: 12px; margin-top: 2px; }
.switch { width: 52px; height: 30px; border-radius: 15px; background: rgba(255, 255, 255, .15); position: relative; flex: none; transition: background .2s; }
.switch i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch.on { background: var(--green); box-shadow: 0 0 12px rgba(46, 230, 160, .55); }
.switch.on i { transform: translateX(22px); }
.pals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.pal-pick { border-radius: 18px; padding: 6px 6px 8px; background: rgba(255, 255, 255, .05); border: 1.5px solid rgba(120, 150, 255, .25); }
.pal-pick img, .pal-dragon { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 14px; display: block; }
.pal-dragon { background: radial-gradient(circle at 50% 40%, #3a2f9e, #151a52); padding: 4px; }
.pal-dragon .dragon, .pal-dragon svg { width: 100%; height: 100%; }
.pal-pick b { display: block; margin-top: 6px; font-weight: 800; }
.pal-pick.on { border-color: var(--orange); box-shadow: 0 0 0 1px var(--orange), 0 0 18px rgba(255, 162, 58, .55); }
.st { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px; }
.st svg { width: 18px; height: 18px; }
.st.ok { color: var(--green); }
.st.warn { color: #ffcf7a; }

/* ---------- dialogs */
.dlg-btns { display: flex; gap: 10px; margin: 16px 0 6px; }
.dlg-btns > * { flex: 1; height: 50px; }

/* ---------- child name */
.child-prev { color: var(--gold); font-weight: 700; font-size: 13.5px; margin-top: 12px !important; }

/* ---------- add story */
.add-opts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.aopt { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 11.5px; line-height: 1.2; cursor: pointer; padding: 10px 2px; border-radius: 16px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); }
.aopt span { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; }
.aopt svg { width: 26px; height: 26px; }
.aopt b { font-weight: 700; }
.o1 span { background: linear-gradient(180deg, #2ec7ff, #1a7fd9); }
.o2 span { background: linear-gradient(180deg, #33d69f, #139a6a); }
.o3 span { background: linear-gradient(180deg, #ff6b7d, #d9304f); }
.o4 span { background: linear-gradient(180deg, #5b8cff, #3452d9); }
.o5 span { background: linear-gradient(180deg, #b27bff, #7b3ff0); }
.aopt.rec span { animation: blink 1.2s infinite; background: linear-gradient(180deg, #ff4d6d, #d92f55); }
@keyframes blink { 50% { opacity: .55; } }
.fld { display: block; margin: 10px 0; }
.fld span, .fld-l { display: block; font-weight: 800; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
.fld input, .fld textarea { width: 100%; border-radius: 14px; background: rgba(255, 255, 255, .07); border: 1px solid var(--line); padding: 12px 14px; outline: none; font-size: 15px; line-height: 1.5; resize: vertical; }
.fld input:focus, .fld textarea:focus { border-color: #6a8cff; box-shadow: 0 0 0 3px rgba(80, 120, 255, .25); }
.pages-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.pg { position: relative; flex: none; }
.pg img { width: 74px; height: 98px; object-fit: cover; border-radius: 10px; }
.pg button { position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; border-radius: 50%; background: rgba(0, 0, 0, .65); display: grid; place-items: center; }
.pg svg { width: 14px; height: 14px; }

/* ---------- bedtime */
.bedtime #app { filter: brightness(.8) saturate(.85); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>

<div id="app">
  <main id="screen"></main>

,overrides:["branch_snap","bubbles"]},{intent:"snore",terms:["snor*","zzz","zzzz"],weight:.9},{intent:"kiss",terms:["kiss*","smooch*","mwah"],weight:.84},{intent:"burp",terms:["burp*","belch*"],weight:.9},{intent:"yawn",terms:["yawn*"],phrases:["eyes were closing"],weight:.88}]}};var di=[Ut,Yt,Xt,Jt,Qt,ei,ti,ii,ai,ni,oi,si,ri,li,ci];var lt=[{id:"all",label:"Wszystkie",tile:"cat_all"},{id:"classic",label:"Klasyczne",tile:"cat_classic"},{id:"adventure",label:"Przygody",tile:"cat_adventure"},{id:"animals",label:"Zwierzęta",tile:"cat_animals"},{id:"fairy",label:"Baśnie",tile:"cat_fairy"},{id:"dino",label:"Dinozaury",tile:"cat_dino"},{id:"space",label:"Kosmos",tile:"cat_space"},{id:"edu",label:"Edukacyjne",tile:"cat_edu"},{id:"night",label:"Na dobranoc",tile:"cat_night"},{id:"magic",label:"Magia",tile:"cat_magic"},{id:"vehicles",label:"Pojazdy",tile:"cat_vehicles"}],X=(a,e,t)=>e.map((i,s)=>({title:i,image:a,thumb:a,text:t[s]})),ct=[{id:"tajemniczy-las",title:"Tajemniczy las",heroes:"Momo i przyjaciele",cover:"cov_forest",hero:"scene_momo",minutes:"5–8 min",age:"3–6 lat",genre:"Przygoda",categories:["adventure","animals"],badge:"new",description:"Momo i jego przyjaciele wyruszają na wyprawę do tajemniczego lasu, gdzie odkrywają magiczne ścieżki, spotykają nowe zwierzątka i uczą się, jak ważna jest przyjaźń i wzajemna pomoc.",chapters:[{title:"Początek",image:"scene_momo",thumb:"ch_b1",text:"Dawno temu, na skraju wielkiego lasu, mieszkał mały, puchaty Momo. Miał ogromne uszy, którymi słyszał nawet najcichsze dźwięki. Pewnego ranka ptaki śpiewały tak wesoło, że Momo wyskoczył z łóżka. Za oknem zapiał kogut, a słońce łaskotało liście. Momo zapukał do drzwi swojego przyjaciela, jeżyka Pipa. Chodźmy do lasu, zawołał Momo, dziś czeka nas przygoda!"},{title:"W lesie",image:"scene_leaf",thumb:"ch_b2",text:"Przyjaciele weszli do lasu. Pod ich łapkami trzaskały suche gałązki, a w krzakach coś zaszeleściło. Nagle niebo zrobiło się ciemne, a z oddali rozległ się grzmot. Zaczęło mocno padać. Momo szybko rozłożył duży liść, żeby wszyscy mogli się schronić. Krople deszczu uderzały o liście, a wiatr szumiał w drzewach. Mały ptaszek Bibi przytulił się do Momo i razem przeczekali ulewę."},{title:"Niespodzianka",image:"ch_b3",thumb:"ch_b3",text:"Wreszcie deszcz przestał padać, wiatr ucichł i wyszło słońce. Na liściach wisiały tysiące kropelek. Przy strumyku żaba rechotała wesoło, a pszczoły brzęczały nad kwiatami. Nagle zza pnia wyskoczył rudy lisek Fino. Fino machnął ogonkiem i pokazał im ukrytą ścieżkę. Na jej końcu stał stary pień, a w nim błyszczało coś złotego. To był magiczny kamyk, który zadzwonił jak dzwoneczek. Wszyscy zaśmiali się z radości."},{title:"Powrót",image:"ch_b4",thumb:"ch_b4",text:"Zrobiło się późno i słońce schowało się za drzewami. Na niebie pojawiły się pierwsze gwiazdy. Gdzieś wysoko sowa zahukała cichutko. Świerszcze grały swoją wieczorną piosenkę. Przyjaciele szli powoli do domu, trzymając się za łapki. Momo ziewnął szeroko. Tej nocy śniło mu się, że las śpiewa razem z nim."}]},{id:"zaginiona-gwiazdka",title:"Zaginiona gwiazdka",heroes:"Momo i Lulu",cover:"cov_star",hero:"cov_star",minutes:"4–6 min",age:"3–6 lat",genre:"Na dobranoc",categories:["night","magic"],badge:"new",description:"Pewnej nocy z nieba spada mała gwiazdka. Momo i motylek Lulu pomagają jej wrócić na niebo, zanim nadejdzie świt.",chapters:X("cov_star",["Spadająca gwiazdka","Nocna wędrówka","Z powrotem na niebo"],["Była cicha, spokojna noc. Księżyc świecił nad łąką, a świerszcze cykały w trawie. Nagle coś błysnęło i z nieba spadła malutka gwiazdka. Wylądowała w trawie tuż obok Momo. Gwiazdka pochlipywała cichutko, bo zgubiła drogę na niebo. Nie płacz, szepnął Momo, pomożemy ci.","Motylek Lulu zatrzepotał skrzydełkami i poleciał przodem. Szli przez ciemny las, a gdzieś daleko pohukiwała sowa. Nad stawem żaby rechotały, a wiatr cichutko szumiał w trzcinach. Nietoperz przeleciał nad ich głowami. Gwiazdka świeciła coraz słabiej, bo była bardzo zmęczona.","Na szczycie wzgórza Lulu machnęła skrzydełkami i posypał się magiczny pył. Wszystko rozbłysło złotym światłem. Zadzwoniły dzwoneczki i gwiazdka uniosła się wysoko, wysoko, aż wróciła na swoje miejsce na niebie. Mrugnęła do nich na dobranoc. Momo ziewnął i przytulił się do Lulu. Po chwili oboje spokojnie zasnęli."])},{id:"wyprawa-nad-rzeke",title:"Wyprawa nad rzekę",heroes:"Momo i Bibi",cover:"cov_river",hero:"cov_river",minutes:"6–9 min",age:"4–7 lat",genre:"Edukacyjna",categories:["edu","adventure","animals"],description:"Momo i ptaszek Bibi płyną łódeczką w dół rzeki. Poznają zwierzęta, które mieszkają nad wodą, i dowiadują się, skąd bierze się deszcz.",chapters:X("cov_river",["Nad wodą","Łódeczka","Wodospad"],["Rano Momo i Bibi poszli nad rzekę. Woda szumiała wesoło i płynęła między kamieniami. Na brzegu kaczki kwakały, a żaba skakała z liścia na liść. Bibi wyjaśnił, że rzeka zaczyna się wysoko w górach jako mały strumyk. Wiesz, powiedział Bibi, woda paruje, robią się z niej chmury, a potem pada deszcz.","Przyjaciele wsiedli do małej łódeczki. Momo wiosłował powoli, a woda pluskała o burty. Nad nimi przelatywały mewy. Z wody wyskoczyła ryba i plusk! Schowała się pod wodą. Nagle zerwał się wiatr i łódka zakołysała się mocno. Trzymaj się, Bibi, zawołał Momo i zaśmiał się głośno.","Za zakrętem usłyszeli głośny szum. To był wielki wodospad! Woda spadała z wysoka, a nad nią świeciła tęcza. Momo i Bibi przybili do brzegu i rozpalili małe ognisko. Ogień trzaskał wesoło, a oni jedli jagody i opowiadali sobie o wszystkim, czego się dziś nauczyli."])},{id:"tajemniczy-zamek",title:"Tajemniczy zamek",heroes:"[Mała księżniczka|Mały rycerz] {n}",cover:"scene_castle",hero:"scene_castle",minutes:"8–10 min",age:"4–8 lat",genre:"Baśń",categories:["fairy","classic","magic"],description:"[Mała księżniczka|Mały rycerz] {n} odkrywa stary zamek na wzgórzu. Za skrzypiącymi drzwiami czekają tajne przejścia, ukryty skarb i pewna bardzo burzowa noc.",chapters:[{title:"Brama zamku",image:"qs_castle",thumb:"qs_castle",text:"Na wysokim wzgórzu stał stary zamek. [Mała księżniczka|Mały rycerz] {n} [podjechała|podjechał] do bramy na swoim koniku. Koń zarżał, a kopyta stukały o kamienie. Most zwodzony opadł z głośnym skrzypieniem. Na wieży zabrzmiały fanfary i zadzwoniły dzwony. Witaj w zamku, [księżniczko|rycerzu], zawołał stary strażnik."},{title:"Tajne przejście",image:"qs_cave",thumb:"qs_cave",text:"W komnacie {n} [zauważyła|zauważył], że jedna z desek w podłodze skrzypi. Pod nią były schody do ciemnej jaskini. Kap, kap, woda kapała ze skał, a każde słowo wracało echem. {n} [szła|szedł] powoli, krok za krokiem, z latarenką w ręku. Nagle nad [jej|jego] głową przeleciał nietoperz. Na końcu korytarza stała stara skrzynia."},{title:"Skarb",image:"knight",thumb:"knight",text:"{n} [otworzyła|otworzył] skrzynię, a wieko zaskrzypiało. W środku błyszczały złote monety i magiczna różdżka. Kiedy {n} [machnęła|machnął] różdżką, wszystko rozbłysło kolorowym światłem. Zabrzmiała cicha pozytywka. Z różdżki wyfrunęła mała wróżka i zachichotała wesoło."},{title:"Burzowa noc",image:"scene_castle",thumb:"scene_castle",text:"Nad zamkiem pojawiły się ciemne chmury. Po chwili zaczęła się potężna burza. Błyskawica przecięła niebo, a grzmot odbił się echem od murów. Wiatr wył w wieżach i szarpał chorągwiami. {n} [usiadła|usiadł] przy kominku, a ogień trzaskał przyjemnie. Wróżka zaśpiewała [jej|mu] kołysankę i burza powoli ucichła."}]},{id:"czerwony-kapturek",title:"Czerwony Kapturek",heroes:"Klasyczna baśń",cover:"cov_redhood",hero:"cov_redhood",minutes:"7–9 min",age:"4–8 lat",genre:"Baśń klasyczna",categories:["classic","fairy"],description:"Znana baśń o dziewczynce w czerwonym kapturku, koszyczku pełnym smakołyków i sprytnym wilku — w wersji z dźwiękami.",chapters:X("cov_redhood",["Koszyczek dla babci","Wilk w lesie","U babci"],["W małym domku na skraju lasu mieszkała dziewczynka, którą wszyscy nazywali Czerwonym Kapturkiem. Pewnego dnia mama upiekła ciasto i zapakowała je do koszyczka. Zanieś to babci, powiedziała mama, i nie zbaczaj ze ścieżki. Kapturek zamknął drzwi i wesoło ruszył w drogę. Ptaki śpiewały, a pszczoły brzęczały nad łąką.","W lesie było cicho i chłodno. Nagle w krzakach coś zaszeleściło i na ścieżce pojawił się wilk. Dokąd idziesz, dziewczynko, zapytał słodkim głosem. Do babci, odpowiedziała Kapturek. Wilk uśmiechnął się chytrze i pobiegł na skróty. Gdzieś daleko w lesie zawył drugi wilk, a kukułka kukała na drzewie.","Kapturek zapukała do drzwi babci. Drzwi zaskrzypiały i dziewczynka weszła do środka. Babciu, jakie masz wielkie uszy, zdziwiła się Kapturek. Wtedy wilk zawarczał i wyskoczył z łóżka! Na szczęście obok przechodził dzielny gajowy. Wilk uciekł do lasu, a babcia wyszła z szafy cała i zdrowa. Wszyscy usiedli przy kominku i zaśmiali się ze strachu, który już minął."])},{id:"kraina-dinozaurow",title:"Kraina Dinozaurów",heroes:"{n} i Tupcio",cover:"cov_dino",hero:"cov_dino",minutes:"6–8 min",age:"4–8 lat",genre:"Przygoda",categories:["dino","adventure","edu"],description:"{n} trafia do krainy, w której wciąż żyją dinozaury. Zaprzyjaźnia się z małym tyranozaurem Tupciem, który boi się... burzy.",chapters:X("cov_dino",["Dżungla","Tupcio","Wulkan"],["{n} [przeszła|przeszedł] przez stare drzwi w szafie i [znalazła|znalazł] się w gęstej dżungli. Wokół rosły paprocie wyższe niż dom. Małpy skakały po gałęziach, a papugi krzyczały głośno. Nagle ziemia zadrżała. Tup, tup, tup, coś wielkiego szło przez las.","Spomiędzy liści wyjrzał mały tyranozaur. Dinozaur ryknął, ale zaraz się zawstydził, bo zamiast groźnego ryku wyszło mu ciche piśnięcie. {n} [zaśmiała|zaśmiał] się i [pogłaskała|pogłaskał] go po nosie. Mam na imię Tupcio, powiedział dinozaur. Nad ich głowami przeleciał pterodaktyl i zaskrzeczał głośno.","Wieczorem niebo pociemniało i zaczęło grzmieć. Tupcio schował się za {n:i}, bo bał się burzy. Nie bój się, [powiedziała|powiedział] {n}, grzmot tylko głośno mówi. Deszcz padał na liście, a oni śpiewali piosenkę, aż burza minęła. Kiedy wyszło słońce, {n} [wróciła|wrócił] przez drzwi do domu, obiecując Tupciowi, że jutro znów przyjdzie."])},{id:"podwodny-swiat",title:"Podwodny świat",heroes:"Syrenka Nela",cover:"cov_underwater",hero:"cov_underwater",minutes:"5–7 min",age:"3–7 lat",genre:"Przygoda",categories:["adventure","animals","edu"],description:"Syrenka Nela pokazuje przyjaciołom, co kryje się pod falami: rafę, delfiny, wieloryba i zatopiony skarb.",chapters:X("cov_underwater",["Nad morzem","Pod wodą","Pieśń wieloryba"],["Fale szumiały na plaży, a mewy krzyczały nad morzem. Staś i Zuzia budowali zamek z piasku. Nagle z wody wyjrzała syrenka Nela. Chodźcie ze mną, zaprosiła, pokażę wam mój świat. Dała im magiczne muszelki i dzieci zanurkowały z pluskiem.","Pod wodą było cicho i niebiesko. Bąbelki leciały do góry, a kolorowe rybki pływały wokół rafy. Wesoły delfin zapiszczał i zrobił fikołka. Na dnie leżała stara skrzynia pełna pereł. Zuzia otworzyła ją ostrożnie, a w środku coś zamigotało.","Nagle z głębin dobiegła piękna, długa pieśń. To śpiewał wieloryb! Był ogromny i bardzo łagodny. Nela pogłaskała go po boku, a wieloryb wypuścił wielką fontannę bąbelków. Kiedy słońce zaczęło zachodzić, dzieci wypłynęły na brzeg. Fale cicho szumiały im na dobranoc."])},{id:"statek-piratow",title:"Statek piratów",heroes:"Kapitan Kuba",cover:"cov_pirates",hero:"cov_pirates",minutes:"6–8 min",age:"4–8 lat",genre:"Przygoda",categories:["adventure","classic"],description:"Kapitan Kuba i jego załoga płyną po skarb. Po drodze czeka ich sztorm, papuga gaduła i bardzo tajemnicza mapa.",chapters:X("cov_pirates",["Na pokładzie","Sztorm","Wyspa skarbów"],["Statek kołysał się na falach, a deski pokładu skrzypiały pod stopami marynarzy. Kapitan Kuba rozwinął starą mapę. Papuga na jego ramieniu zaskrzeczała: skarb, skarb! Zabrzmiał dzwon okrętowy i kapitan zawołał: podnieść żagle! Wiatr wypełnił żagle i statek ruszył przed siebie.","Po południu niebo zrobiło się ciemne. Zerwał się silny wiatr i rozpętał się sztorm. Fale uderzały o burty, a deszcz lał jak z cebra. Błyskawica przecięła niebo i huknął grzmot. Trzymajcie się, zawołał kapitan. Załoga dzielnie trzymała liny, aż burza ucichła.","Rano mewy krzyczały nad małą wyspą. Piraci wyskoczyli z łodzi z głośnym pluskiem. Kuba policzył kroki od palmy i zaczął kopać. Łopata stuknęła w coś twardego. To była skrzynia! Wieko zaskrzypiało, a w środku błyszczało złoto. Cała załoga zaczęła się śmiać i tańczyć na piasku."])},{id:"przyjaciel-z-innego-swiata",title:"Przyjaciel z innego świata",heroes:"{n} i smok Pufek",cover:"scene_dragon",hero:"scene_dragon",minutes:"12 min",age:"4–8 lat",genre:"Przygoda",categories:["magic","fairy","adventure"],badge:"new",description:"[Mała dziewczynka|Mały chłopiec] odkrywa tajemnicze jajo w lesie, z którego wykluwa się niezwykły smok. Razem wyruszają w podróż pełną przygód, poznając nowych przyjaciół i magiczne miejsca.",chapters:[{title:"Tajemnicze jajo",image:"ch_a3",thumb:"ch_a2",text:"Pewnego wieczoru {n} [poszła|poszedł] z latarką do lasu. Sowa pohukiwała na gałęzi, a pod butami trzeszczały gałązki. Nagle między korzeniami coś zaświeciło. To było wielkie, ciepłe jajo w kolorowe plamki. {n} ostrożnie [zaniosła|zaniósł] je do domu i [położyła|położył] przy kominku."},{title:"Pufek",image:"scene_dragon",thumb:"ch_a1",text:"W nocy coś zapukało. Puk, puk, puk, to pukało jajo! Skorupka pękła z trzaskiem i wyjrzał z niej mały smok. Smoczek kichnął, a z jego nosa wyleciała iskierka. {n} [zaśmiała|zaśmiał] się głośno. Będziesz się nazywać Pufek, [powiedziała|powiedział]."},{title:"Pierwszy lot",image:"ch_a3",thumb:"ch_a3",text:"Pufek rósł szybko. Pewnego ranka zatrzepotał skrzydłami i uniósł się nad łąką. {n} [usiadła|usiadł] na jego grzbiecie i polecieli wysoko, ponad chmury. Wiatr gwizdał im w uszach, a pod nimi szumiało morze. Mewy krzyczały, a Pufek ryknął radośnie."},{title:"Powrót do domu",image:"ch_a4",thumb:"ch_a4",text:"Wieczorem wylądowali na polanie. Pufek zionął ogniem i rozpalił ognisko. Ogień trzaskał, a nad nimi migotały gwiazdy. Świerszcze cykały w trawie. {n} [przytuliła|przytulił] smoka i [ziewnęła|ziewnął]. Dobranoc, przyjacielu, [szepnęła|szepnął]. Pufek zamruczał cicho i oboje zasnęli."}]},{id:"rakieta-tosi",title:"Rakieta {n:g}",heroes:"{n} i robot Bip",cover:"cov_space",hero:"cov_space",minutes:"5–7 min",age:"4–8 lat",genre:"Kosmos",categories:["space","edu"],description:"{n} buduje rakietę z kartonu, a robot Bip zabiera [ją|go] na prawdziwą wyprawę na Księżyc i do gwiazd.",chapters:X("cov_space",["Start","Księżyc","Gwiazdy"],["{n} [zbudowała|zbudował] w pokoju rakietę z kartonu. Nagle robot Bip zapiszczał i zamrugał światełkami. Rakieta jest gotowa, powiedział Bip. {n} [zapięła|zapiął] pasy. Dziesięć, dziewięć, osiem... trzy, dwa, jeden, start! Silniki zahuczały i rakieta wystartowała w górę.","W kosmosie było cicho i ciemno. Za oknem świeciły tysiące gwiazd. Rakieta łagodnie wylądowała na Księżycu. {n} [skakała|skakał] po kraterach, bo na Księżycu wszystko jest lżejsze. Bip wyjaśnił, że Księżyc krąży wokół Ziemi, a Ziemia wokół Słońca.","Nagle obok przeleciał mały statek kosmiczny. Wyjrzał z niego zielony kosmita i pomachał wesoło. Kosmita zaśmiał się i dał {n:d} świecący kamyk. Czas wracać do domu, zapiszczał Bip. Rakieta wróciła na Ziemię, a {n} [ziewnęła|ziewnął] i [zasnęła|zasnął] w swoim łóżku."])},{id:"wielki-wyscig",title:"Wielki wyścig",heroes:"Autko Pik",cover:"cov_vehicles",hero:"cov_vehicles",minutes:"4–6 min",age:"3–6 lat",genre:"Pojazdy",categories:["vehicles","edu"],description:"Małe czerwone autko Pik bierze udział w wielkim wyścigu przez miasto, wieś i las. Po drodze spotyka pociąg, traktor i helikopter.",chapters:X("cov_vehicles",["W mieście","Na wsi","Meta"],["Autko Pik obudziło się w garażu. Dziś wielki wyścig! Pik zatrąbiło wesoło i wyjechało na ulicę. W mieście było gwarno. Samochody jechały jeden za drugim, a gdzieś w oddali zawyła syrena karetki. Pik zatrzymało się na czerwonym świetle i grzecznie poczekało.","Za miastem droga wiła się wśród pól. Traktor pracował na polu, a krowy muczały na łące. Obok toru przejechał pociąg i gwizdnął głośno. Kogut zapiał, a kury rozbiegły się na boki. Pik pomachało wszystkim światłami.","Nad metą krążył helikopter. Pik dodało gazu i dojechało pierwsze! Wszyscy klaskali i wiwatowali. Na podium zabrzmiały fanfary. Pik zatrąbiło radośnie, a potem wróciło do garażu i zasnęło zmęczone, ale szczęśliwe."])}];function ui(a,e){let t=a.replace(/\r/g,"").replace(/[ \t]+/g," ").trim(),i=t.split(/\n\s*\n+/).map(o=>o.replace(/\n/g," ").trim()).filter(Boolean),s=[],n="";for(let o of i.length?i:[t])n&&(n+" "+o).length>900?(s.push({title:`Część ${s.length+1}`,image:e,thumb:e,text:n}),n=o):n=n?`${n} ${o}`:o;return n&&s.push({title:`Część ${s.length+1}`,image:e,thumb:e,text:n}),s.flatMap(o=>{if(o.text.length<=1400)return[o];let r=o.text.split(/(?<=[.!?…])\s+/),l=[],c="";for(let u of r)c&&(c+" "+u).length>900?(l.push(c),c=u):c=c?`${c} ${u}`:u;return c&&l.push(c),l.map(u=>({...o,text:u}))}).map((o,r)=>({...o,title:`Część ${r+1}`}))}var De={name:"Kamilka",girl:!0};function dt(a,e){let t=a.trim()||De.name;if(e==="n")return t;let i=t.toLowerCase();if(i.endsWith("a")){let o=t.slice(0,-1),r=o.toLowerCase(),l=/(i|j|l|ć|ś|ź|ń)$/.test(r),c=/(c|cz|sz|rz|ż|dż|dz)$/.test(r),u=/(k|g)$/.test(r)?o+"i":r.endsWith("i")?/(s|z|c|n)i$/.test(r)?o:o+"i":r.endsWith("j")?o.slice(0,-1)+"i":l?o+"i":o+"y";return e==="g"?u:e==="a"?o+"ę":e==="i"?o+"ą":r.endsWith("i")||r.endsWith("j")||l||c?u:r.endsWith("k")?o.slice(0,-1)+"ce":r.endsWith("g")?o.slice(0,-1)+"dze":r.endsWith("st")?o.slice(0,-2)+"ście":r.endsWith("t")?o.slice(0,-1)+"cie":r.endsWith("d")?o.slice(0,-1)+"dzie":r.endsWith("r")?o+"ze":r.endsWith("ł")?o.slice(0,-1)+"le":r.endsWith("ch")?o.slice(0,-2)+"sze":o+"ie"}if(/[eiouyąęó]$/.test(i))return t;let s=t;/ek$/.test(i)&&i.length>3&&(s=t.slice(0,-2)+t.slice(-1));let n=s.toLowerCase();return n.endsWith("ś")?s=s.slice(0,-1)+"si":n.endsWith("ź")?s=s.slice(0,-1)+"zi":n.endsWith("ń")?s=s .dragon { position: relative; width: 150px; height: 156px; }
.dragon svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 8px 14px rgba(7, 11, 36, .45)); }
.dragon .dg-all { transform-origin: 50% 90%; }
.dragon svg { animation: dg-bob 3s ease-in-out infinite; transform-origin: 50% 95%; }
@keyframes dg-bob { 50% { transform: translateY(-5px) scale(1.01, .99); } }
.dg-wing { transform-box: fill-box; animation: dg-flap 1.6s ease-in-out infinite; }
.dg-wing-l { transform-origin: 100% 60%; }
.dg-wing-r { transform-origin: 0% 60%; animation-delay: .05s; }
@keyframes dg-flap { 50% { transform: rotate(-10deg) scaleY(.92); } }
.dg-wing-r { animation-name: dg-flap-r; }
@keyframes dg-flap-r { 50% { transform: rotate(10deg) scaleY(.92); } }
.dg-tail { transform-box: fill-box; transform-origin: 0% 80%; animation: dg-tail 2.4s ease-in-out infinite; }
@keyframes dg-tail { 50% { transform: rotate(8deg); } }
.dg-blink { transform-box: fill-box; transform-origin: center; animation: dg-blink 4.5s infinite; }
@keyframes dg-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
.dg-head { transform-box: fill-box; transform-origin: 50% 90%; transition: transform .4s; }

/* everything optional hidden by default */
.dragon [class^="dg-eyes-"], .dragon [class^="dg-mouth-"], .dragon [class^="dg-arms-"], .dg-zzz, .dg-sparks, .dg-drop, .dg-bang { display: none; }

/* idle */
.dragon[data-mood="idle"] .dg-eyes-open, .dragon[data-mood="idle"] .dg-mouth-smile, .dragon[data-mood="idle"] .dg-arms-rest { display: inline; }
/* listening: head tilt */
.dragon[data-mood="listen"] .dg-eyes-open, .dragon[data-mood="listen"] .dg-mouth-smile, .dragon[data-mood="listen"] .dg-arms-rest { display: inline; }
.dragon[data-mood="listen"] .dg-head { transform: rotate(-7deg); }
/* scared: covers eyes, shivers */
.dragon[data-mood="scared"] .dg-arms-cover, .dragon[data-mood="scared"] .dg-mouth-wavy, .dragon[data-mood="scared"] .dg-drop { display: inline; }
.dragon[data-mood="scared"] svg { animation: dg-shiver .12s linear infinite; }
@keyframes dg-shiver { 0% { transform: translateX(-1.5px); } 50% { transform: translateX(1.5px); } 100% { transform: translateX(-1.5px); } }
/* magic: wand + sparkles */
.dragon[data-mood="magic"] .dg-eyes-happy, .dragon[data-mood="magic"] .dg-mouth-open, .dragon[data-mood="magic"] .dg-arms-wand, .dragon[data-mood="magic"] .dg-sparks { display: inline; }
.dg-wand { transform-box: fill-box; transform-origin: 0% 100%; animation: dg-wave .5s ease-in-out infinite alternate; }
@keyframes dg-wave { to { transform: rotate(14deg); } }
.dg-sparks { animation: dg-twinkle .6s ease-in-out infinite alternate; }
@keyframes dg-twinkle { to { opacity: .3; } }
/* laugh */
.dragon[data-mood="laugh"] .dg-eyes-happy, .dragon[data-mood="laugh"] .dg-mouth-open, .dragon[data-mood="laugh"] .dg-arms-up { display: inline; }
.dragon[data-mood="laugh"] svg { animation: dg-hop .45s ease-in-out infinite alternate; }
@keyframes dg-hop { to { transform: translateY(-10px); } }
/* sleepy */
.dragon[data-mood="sleepy"] .dg-eyes-sleepy, .dragon[data-mood="sleepy"] .dg-mouth-o, .dragon[data-mood="sleepy"] .dg-arms-rest, .dragon[data-mood="sleepy"] .dg-zzz { display: inline; }
.dragon[data-mood="sleepy"] .dg-head { transform: rotate(8deg) translateY(4px); }
.dragon[data-mood="sleepy"] svg { animation-duration: 5s; }
.dg-zzz text { animation: dg-z 2.4s ease-in-out infinite; }
.dg-zzz text:nth-child(2) { animation-delay: .4s; } .dg-zzz text:nth-child(3) { animation-delay: .8s; }
@keyframes dg-z { 0% { opacity: 0; } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
/* surprised */
.dragon[data-mood="surprised"] .dg-eyes-wide, .dragon[data-mood="surprised"] .dg-mouth-o, .dragon[data-mood="surprised"] .dg-arms-up, .dragon[data-mood="surprised"] .dg-bang { display: inline; }
.dragon[data-mood="surprised"] svg { animation: dg-jump .5s ease-out 1; }
@keyframes dg-jump { 40% { transform: translateY(-16px); } }

.dg-bubble {
  position: absolute; left: 62%; top: -8px; white-space: nowrap;
  background: #fff; color: #1a1450; font: 700 14px/1.2 'Fredoka', 'Trebuchet MS', sans-serif;
  padding: 7px 12px; border-radius: 16px; box-shadow: 0 6px 16px rgba(7, 11, 36, .35);
  opacity: 0; transform: translateY(6px) scale(.9); transition: opacity .25s, transform .25s; pointer-events: none;
}
.dg-bubble::after { content: ''; position: absolute; left: 14px; bottom: -7px; border: 8px solid transparent; border-top-color: #fff; border-bottom: 0; }
.dg-bubble.on { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .dragon svg, .dg-wing, .dg-tail, .dg-blink, .dg-wand, .dg-zzz text { animation: none !important; } }
